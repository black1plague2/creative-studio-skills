<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">A primary journey includes recovery</title><desc id="desc">Fictional CampusCart borrowing prototype.. Choose → Request → Pending → Confirm.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#153f2b" stroke-width="1.5"/></marker></defs><g font-family="system-ui, sans-serif"><rect width="1200" height="390" rx="24" fill="#f6f3e8"/><text x="48" y="58" font-size="29" font-weight="700" fill="#153f2b">A primary journey includes recovery</text><text x="48" y="91" font-size="15" fill="#47554a">Fictional CampusCart borrowing prototype.</text><rect x="151.0" y="145" width="196" height="128" rx="14" fill="#d5e7ef"/><circle cx="178.0" cy="174" r="14" fill="#ffffff"/><text x="178.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">1</text><text x="169.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Choose</text><text x="169.0" y="245" font-size="13" fill="#153f2b">Available item</text><path d="M 355.0 209 H 376.0" stroke="#153f2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="385.0" y="145" width="196" height="128" rx="14" fill="#f3d36a"/><circle cx="412.0" cy="174" r="14" fill="#ffffff"/><text x="412.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">2</text><text x="403.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Request</text><text x="403.0" y="245" font-size="13" fill="#153f2b">Dates + field errors</text><path d="M 589.0 209 H 610.0" stroke="#153f2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="619.0" y="145" width="196" height="128" rx="14" fill="#cee4c4"/><circle cx="646.0" cy="174" r="14" fill="#ffffff"/><text x="646.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">3</text><text x="637.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Pending</text><text x="637.0" y="245" font-size="13" fill="#153f2b">Feedback + next step</text><path d="M 823.0 209 H 844.0" stroke="#153f2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="853.0" y="145" width="196" height="128" rx="14" fill="#efcdb7"/><circle cx="880.0" cy="174" r="14" fill="#ffffff"/><text x="880.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">4</text><text x="871.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Confirm</text><text x="871.0" y="245" font-size="13" fill="#153f2b">Handoff / return</text><text x="48" y="315" font-size="14" fill="#47554a">Unavailable item → explain and choose another. Invalid dates → show a field-level recovery.</text><text x="48" y="339" font-size="14" fill="#47554a">Prototype interactions do not imply a real owner, database or deployed service.</text></g></svg>