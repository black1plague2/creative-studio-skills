<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">A natural voice needs a listening gate</title><desc id="desc">A preset name or waveform cannot establish conversational delivery.. Script → Audition → Measure → Listen.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#153f2b" stroke-width="1.5"/></marker></defs><g font-family="system-ui, sans-serif"><rect width="1200" height="390" rx="24" fill="#f6f3e8"/><text x="48" y="58" font-size="29" font-weight="700" fill="#153f2b">A natural voice needs a listening gate</text><text x="48" y="91" font-size="15" fill="#47554a">A preset name or waveform cannot establish conversational delivery.</text><rect x="151.0" y="145" width="196" height="128" rx="14" fill="#d5e7ef"/><circle cx="178.0" cy="174" r="14" fill="#ffffff"/><text x="178.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">1</text><text x="169.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Script</text><text x="169.0" y="245" font-size="13" fill="#153f2b">Write for speech</text><path d="M 355.0 209 H 376.0" stroke="#153f2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="385.0" y="145" width="196" height="128" rx="14" fill="#f3d36a"/><circle cx="412.0" cy="174" r="14" fill="#ffffff"/><text x="412.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">2</text><text x="403.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Audition</text><text x="403.0" y="245" font-size="13" fill="#153f2b">Real difficult sentence</text><path d="M 589.0 209 H 610.0" stroke="#153f2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="619.0" y="145" width="196" height="128" rx="14" fill="#cee4c4"/><circle cx="646.0" cy="174" r="14" fill="#ffffff"/><text x="646.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">3</text><text x="637.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Measure</text><text x="637.0" y="245" font-size="13" fill="#153f2b">Timing + pronunciation</text><path d="M 823.0 209 H 844.0" stroke="#153f2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="853.0" y="145" width="196" height="128" rx="14" fill="#efcdb7"/><circle cx="880.0" cy="174" r="14" fill="#ffffff"/><text x="880.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">4</text><text x="871.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Listen</text><text x="871.0" y="245" font-size="13" fill="#153f2b">Alone, then with picture</text><text x="48" y="315" font-size="14" fill="#47554a">Cut unnecessary copy before accelerating the voice.</text><text x="48" y="339" font-size="14" fill="#47554a">If listening is unavailable, disclose it and provide an audition for the user.</text></g></svg>