<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Source to considered creative work</title><desc id="desc">One coherent direction; different treatments for different media.. Source → Brief → Produce → Review → Deliver.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#153f2b" stroke-width="1.5"/></marker></defs><g font-family="system-ui, sans-serif"><rect width="1200" height="390" rx="24" fill="#f6f3e8"/><text x="48" y="58" font-size="29" font-weight="700" fill="#153f2b">Source to considered creative work</text><text x="48" y="91" font-size="15" fill="#47554a">One coherent direction; different treatments for different media.</text><rect x="34.0" y="145" width="196" height="128" rx="14" fill="#d5e7ef"/><circle cx="61.0" cy="174" r="14" fill="#ffffff"/><text x="61.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">1</text><text x="52.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Source</text><text x="52.0" y="245" font-size="13" fill="#153f2b">PRD / PDF / PPT / notes</text><path d="M 238.0 209 H 259.0" stroke="#153f2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="268.0" y="145" width="196" height="128" rx="14" fill="#f3d36a"/><circle cx="295.0" cy="174" r="14" fill="#ffffff"/><text x="295.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">2</text><text x="286.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Brief</text><text x="286.0" y="245" font-size="13" fill="#153f2b">Ask material gaps</text><path d="M 472.0 209 H 493.0" stroke="#153f2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="502.0" y="145" width="196" height="128" rx="14" fill="#cee4c4"/><circle cx="529.0" cy="174" r="14" fill="#ffffff"/><text x="529.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">3</text><text x="520.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Produce</text><text x="520.0" y="245" font-size="13" fill="#153f2b">Use actual tools</text><path d="M 706.0 209 H 727.0" stroke="#153f2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="736.0" y="145" width="196" height="128" rx="14" fill="#efcdb7"/><circle cx="763.0" cy="174" r="14" fill="#ffffff"/><text x="763.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">4</text><text x="754.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Review</text><text x="754.0" y="245" font-size="13" fill="#153f2b">Inspect final output</text><path d="M 940.0 209 H 961.0" stroke="#153f2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="970.0" y="145" width="196" height="128" rx="14" fill="#d5e7ef"/><circle cx="997.0" cy="174" r="14" fill="#ffffff"/><text x="997.0" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#153f2b">5</text><text x="988.0" y="213" font-size="20" font-weight="700" fill="#153f2b">Deliver</text><text x="988.0" y="245" font-size="13" fill="#153f2b">Files + honest handoff</text><text x="48" y="315" font-size="14" fill="#47554a">GPT posters: full-slide image generation. Other skills: provider-neutral production.</text><text x="48" y="339" font-size="14" fill="#47554a">A plan is not a generated artifact. A score is not the relevant inspection.</text></g></svg>